AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lambda functions for Ukiyo e-commerce backend'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]
    Description: Environment name
  
  JWTSecret:
    Type: String
    NoEcho: true
    Description: JWT secret for token signing
  
  GoogleClientId:
    Type: String
    Description: Google OAuth client ID
  
  AppleClientId:
    Type: String
    Description: Apple Sign-In client ID
  
  FrontendUrl:
    Type: String
    Default: https://ukiyo.com
    Description: Frontend URL for CORS and redirects

Resources:
  # IAM Role for Lambda functions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ukiyo-*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ukiyo-*/index/*'
        - PolicyName: SESAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'

  # Google Auth Lambda
  GoogleAuthLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ukiyo-google-auth
      Runtime: python3.9
      Handler: google_auth.lambda_handler
      Code:
        ZipFile: |
          # Placeholder - will be replaced with actual code
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': 'Google Auth Lambda'}
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          JWT_SECRET: !Ref JWTSecret
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          ENVIRONMENT: !Ref Environment
          USERS_TABLE: ukiyo-users
          USER_AUTH_TABLE: ukiyo-user-auth
      Timeout: 30
      MemorySize: 256

